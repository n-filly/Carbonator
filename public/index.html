<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

</head>
<body id="homepage">
    <header>
        <nav>

            <a href="index.html">
                <img class="nav-logo" src="images/carbonator-logo.JPG" alt="carbonator navigation">
            </a>

            <ul class="nav-options">
                <li> <a href="resources.html">Resources</a> </li>
                <li> <a href="about-us.html">About Us</a> </li>
                <li> <a href="reach-out.html">Reach Out</a> </li>
            </ul>

        </nav>
    </header>
    

    <form class="main-form">
        <div class="col-xxl-4">

            <div class="card">
                <div class="card-body">
                    <h2>Electricity</h2>

                    <label for="electricity-country-input" class="label">In what country was the electricity consumed?</label>
                    <select id="electricity-country-input" class="elec">
                        <option value="">Select country</option>
                    </select>

                    <label for="electricity-num-input" class="label">How much electricity was consumed?</label>
                    <input type="number" id="electricity-num-input" class="elec" min="0"></input>
                
                    <label for="electricity-unit-input" class="label">What is the unit of measurement?</label>
                    <select id="electricity-unit-input" class="elec">
                        <option value="">Select the electrical unit</option>
                        <option value="kWh">kWh</option>
                        <option value="MWh">MWh</option>
                    </select>
                    
                    <div id="elec-result" class="carbon-result"></div>

                    <button type="button" id="elec-calc">Calculate</button>
                    <button type="button" class="reset" id="elec">RESET</button>
                </div>
            </div>

            <div class="card row">
                <div class="card-body">
                    <h2>Fuel</h2>
                    
                    <label for="fuel-type-input" class="label">What kind of fuel was burned?</label>
                    <select id="fuel-type-input" class="fuel">
                        <option value="">Select Fuel Type</option>
                        <option value="Gas">Gas</option>
                        <option value="Liquid">Liquid</option>
                        <option value="Solid">Solid</option>
                    </select>

                    <div class="fuel-name-container">
                        <label for="fuel-name-input" class="label">What is the name of the fuel?</label>
                        <select id="fuel-name-input" class="fuel">
                            <option value="">Select Fuel Name</option>
                        </select>
                    </div>

                    <label for="fuel-unit-input" class="label">What weight unit do you want to use</label>
                    <select id="fuel-unit-input" class="fuel">
                        <option value="">Select mass unit</option>
                        <option value="kg">Kilograms (kg)</option>
                        <option value="lbs">Pounds (lbs)</option>
                    </select>

                    <label for="fuel-amount-input" class="label">How much of that fuel you are using?</label>
                    <input type="number" id="fuel-amount-input" class="fuel" min="0"></input>

                    <div id="fuel-result" class="carbon-result"></div>

                    <button type="button" id="fuel-calc">Calculate</button>
                    <button type="button" class="reset" id="fuel">RESET</button>
                </div>
            </div>

        </div>


        <div class="col-xxl-4 row">

            <div class="card" id="center-card">
                <div class="card-body">
                    <h2>Total estimated emissions:</h2>
                    <ul>
                        <li id="kg"></li>
                        <li id="lbs"></li>
                    </ul>
                    <h2>Your emissions are comparable to:</h2>
                    <h3 id="total-emissions"></h3>
                    <div id="final-result"></div>
                    <button type="button" id="reset-all">RESET ALL</button>
                </div>
            </div>

        </div>


        <div class="col-xxl-4 row">

            <div class="card">
                <div class="card-body">
                    <h2>Vehicles</h2>
                
                    <label for="vehicle-size-input" class="label">What is the category/size of the vehicle?</label>
                    <select id="vehicle-size-input" class="vehicle">
                        <option value="">Select Vehicle Type</option>
                    </select>

                    <label for="vehicle-fuel-input" class="label">What type of fuel does it use?</label>
                    <select id="vehicle-fuel-input" class="vehicle">
                        <option value="">Select fuel type</option>
                        <option value="Unknown">Unknown</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Petrol">Petrol</option>
                        <option value="PHEV">PHEV</option>
                        <option value="BEV">BEV</option>
                    </select>

                    <label for="vehicle-unit-input" class="label">Distance unit</label>
                    <select id="vehicle-unit-input" class="vehicle">
                        <option value="">Select distance unit</option>
                        <option value="mi">Miles (mi)</option>
                        <option value="km">Kilometres (km)</option>
                    </select>

                    <label for="vehicle-distance-input" class="label">What distance was traveled?</label>
                    <input type="number" id="vehicle-distance-input" class="vehicle" min="0"></input>

                    <div id="vehicle-result" class="carbon-result"></div>

                    <button type="button" id="vehicle-calc">Calculate</button>
                    <button type="button" class="reset" id="vehicle">RESET</button>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2>Shipping</h2>
                    <label for="shipping-method-input" class="label">How are the goods being shipped?</label>
                    <select id="shipping-method-input" class="freight">
                        <option value="">Select shipping options</option>
                        <option value="Air">Air</option>
                        <option value="Rail">Rail</option>
                        <option value="Road">Road</option>
                        <option value="ShortSea">ShortSea</option>
                        <option value="DeepSea">DeepSea</option>
                        <option value="Road-Rail">Road-Rail</option>
                        <option value="Road-ShortSea">Road-DeepSea</option>
                    </select>

                    <label for="shipping-weight-input" class="label">How heavy is the cargo shipment?</label>
                    <input type="number" id="shipping-weight-input" min="0" class="freight"></input>

                    <label for="shipping-w-units-input" class="label">What is the weight unit?</label>
                    <select id="shipping-w-units-input" class="freight">
                        <option value="">Select mass unit</option>
                        <option value="kg">Kilograms (kg)</option>
                        <option value="lbs">Pounds (lbs)</option>
                    </select>

                    <label for="shipping-distance-input" class="label">How far is the shipment traveling?</label>
                    <input type="number" id="shipping-distance-input" min="0" class="freight"></input>

                    <label for="shipping-d-units-input" class="label">What is the distance unit?</label>
                    <select id="shipping-d-units-input" class="freight">
                        <option value="">Select distance unit</option>
                        <option value="mi">Miles (mi)</option>
                        <option value="km">Kilometres (km)</option>
                    </select>

                    <div id="shipping-result" class="carbon-result"></div>

                    <button type="button" id="shipping-calc">Calculate</button>
                    <button type="button" class="reset" id="freight">RESET</button>
                </div>
            </div>

        </div>
    </form>

    <footer>
        <p>&copy; Carbonator 2026. All rights reserved.</p>
    </footer>
</body>
</html>
